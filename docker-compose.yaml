# docker-compose.yml
services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery
    command: celery -A tasks worker --loglevel=info --pool=eventlet
    volumes:
      - .:/app
    depends_on:
      - redis
      - backend
    env_file:
      - .env
    restart: always
    extra_hosts:
      - "redis:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
